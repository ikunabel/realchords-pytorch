# GT-only chord-distribution collection (no models). Used by both
# realchords/utils/custom_evaluation.py (metrics) and
# scripts/eval/export_paired_midis.py (MIDI export, a separate step run
# against this same save_dir) -- see scripts/eval/run_custom_eval.py.
# filobass uses a higher chord_octave (5) for its naive chord voicings in
# the MIDI export (custom_evaluation.py itself ignores chord_octave).
gt_only: true
dataset_name: filobass
dataset_split: all
save_dir: logs/custom_eval/gt/filobass_all
batch_size: 64
num_batches: -1
seed: 42
chord_octave: 5
