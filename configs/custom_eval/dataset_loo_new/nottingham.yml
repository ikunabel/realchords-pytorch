# One checkpoint per run, chosen by minimum AGGREGATE val/loss over that run's own
# training corpora. Not per-test-corpus as in the alpha sweep: the held-out corpus
# has no validation loss in its own LOO run, so a per-corpus rule is undefined there.
# The aggregate rule is identical across variants and keeps the held-out corpus out
# of model selection entirely. See scripts/data/select_loo_checkpoints.py.

