# Hooktheory LOO eval via run_multi_model_eval.py instead of run_custom_eval.py.
#
# Why: all 27 models in one process needs ~100 min of GPU, and the login-node limit is 30.
# SLURM was the intended route but c23g had 0 idle nodes (13 of 50 drained) and scheduled
# the job two days out, so it is not an option either. This script runs each model as its
# own short subprocess (~3-4 min) and merges by seq_idx afterwards, so no single GPU
# process approaches the cap. Window enumeration is deterministic (all_windows, seed 42),
# which is what makes the merge valid.
#
# Run: python scripts/eval/custom_eval/run_multi_model_eval.py configs/custom_eval/dataset_loo_new/hooktheory_multimodel.yml
dataset_name: hooktheory
dataset_split: test
batch_size: 64
num_batches: -1
seed: 42
midi_samples: 0
clamp2_samples: 0
cropped_max_len: 512
all_windows: true
save_dir: logs/custom_eval/dataset_loo_new/hooktheory
models:
- label: 7sets_s42
  checkpoint: /hpcwork/thes2192/realchords/logs/my_logs/decoder_only/decoder.chord.7sets.seed=42.alpha=0.5_9n0268ae/step=9000.ckpt
- label: 7sets_s43
