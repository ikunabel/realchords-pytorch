# Walking-bass datasets (WJD, FiloBass; the "melody" lane is a walking bass line), evaluated on
# valid+test combined -- exceptionally, because the test splits alone are tiny (WJD 42, FiloBass
# 6 pieces). Caveat: valid was used for checkpoint selection of the two WJD+FiloBass models.
# Decoder-only (online) and encoder-decoder (offline) models, each trained on WJD+FiloBass only
# vs on the 7-dataset mix (never saw either set); compare within architecture. All share the
# 6198-token vocab -> one run. See journal/DATASET_MIX_LOO.md.
# Submit: sbatch scripts/jobscripts/eval/run_custom_eval.sh configs/custom_eval/wjd_filobass_validtest/filobass.yml
base_model: "/hpcwork/thes2192/realchords/logs/my_logs/decoder_only/decoder.chord.wjd_filobass.seed=42.alpha=0.5_3i5b8adr/step=2700.ckpt"
model:
  - "Decoder_WJD_FiloBass=base"
  - "Decoder_7sets=/hpcwork/thes2192/realchords/logs/my_logs/decoder_only/decoder.chord.7sets.seed=42.alpha=0.5_7mhnk76x/step=10000.ckpt"
  - "EncDec_WJD_FiloBass=/hpcwork/thes2192/realchords/logs/my_logs/enc_dec/enc_dec.chord.wjd_filobass.seed=42.alpha=0.5_643oteil/step=3000.ckpt"
  - "EncDec_7sets=/hpcwork/thes2192/realchords/logs/my_logs/enc_dec/enc_dec.chord.7sets.seed=1.alpha=0.5/step=13000.ckpt"
seed: 42

dataset_name: filobass
dataset_split: valid+test
save_dir: logs/custom_eval/wjd_filobass_validtest/filobass
batch_size: 64
num_batches: -1
midi_samples: 10
clamp2_samples: -1
