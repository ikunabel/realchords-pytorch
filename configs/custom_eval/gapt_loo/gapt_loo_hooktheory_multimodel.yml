# Hooktheory GAPT-LOO via run_multi_model_eval.py: 2,785 windows x 27 models in one
# process exceeds the 30-min login GPU limit. One short subprocess per model, merged
# by seq_idx. Unique config stem so the staging dir does not collide with other studies.
dataset_name: hooktheory
dataset_split: test
batch_size: 64
num_batches: -1
midi_samples: 0
clamp2_samples: 0
cropped_max_len: 512
all_windows: true
save_dir: logs/custom_eval/gapt_loo/hooktheory
seed: 42
# MLE anchor the GAPT actors were fine-tuned from. The actors are raw .pth state
# dicts, so they are loaded into a copy of this; same anchor as the six per-corpus
# gapt_loo configs, so Hooktheory is scored identically.
base_model: /hpcwork/thes2192/realchords/logs/my_logs/decoder_only/decoder.chord.7sets.seed=42.alpha=0.5_9n0268ae/step=9000.ckpt
