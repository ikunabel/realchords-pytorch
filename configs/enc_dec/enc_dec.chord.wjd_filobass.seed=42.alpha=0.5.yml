# Encoder-decoder chord model on the two walking-bass datasets only (WJD + FiloBass): the
# "melody" lane holds a walking bass line, not a melody -- clear outliers vs. the other
# corpora; this tests whether the model can still learn something useful from them.
# Much smaller than Hooktheory (368 train songs / 530k frames vs. 19,052 / 3.6M; ~12x with
# key augmentation), so the loss minimum comes ~10x sooner (~1.5-2k steps at the same number
# of passes over the data as the Hooktheory enc-dec's best step): validation/checkpoints every
# 100 steps, early stopping after 20 non-improving checks, keep only the 5 best checkpoints,
# dropout 0.2. Architecture, LR (constant 1e-4), batch size and augmentation unchanged.
# See journal/CONFIGS.md.
# Trainer hyperparameters, for Trainer and lit_module
seed: 42
train_steps: 10000 # upper bound; early stopping ends it much earlier
val_interval: 100
sample_interval: 500
max_log_examples: 8
overfit_batches: 0
wandb_project: "realchords"
log_every_n_steps: 1
checkpoint_interval: 100
checkpoint_metric: "val/loss"
checkpoint_mode: "min"
checkpoint_top_k: 5 # keep the 5 best by val/loss (every-100-step ckpts would be ~100 GB)
accelerator: "auto"
devices: "auto"
num_nodes: 1
precision: "bf16-mixed"
strategy: "auto"
compile: True
early_stopping_patience: 20 # validation checks, i.e. 2k steps

# Data hyperparameters, for get_weighted_dataloader
batch_size: 64
num_workers: 8
cache_dir: "data/cache"
chord_names_path: "data/cache/chord_names_augmented.json"
model_part: "chord"
model_type: "encoder_decoder"
max_len: 512
datasets: ["wjd", "filobass"]
alpha: 0.5
data_augmentation: true

# Optimizer hyperparameters
AdamW.lr: 0.0001
AdamW.weight_decay: 0.0

# LR schedule: "none" (flat), "cosine" (warmup + cosine decay to 0 over
# train_steps), or "plateau" (ReduceLROnPlateau, reacts to val/loss directly)
lr_schedule: "none"  # constant LR = reference implementation, see journal/CONFIGS.md
warmup_steps: 1000

# Model hyperparameters
EncoderDecoderTransformer.enc_dim: 512
EncoderDecoderTransformer.dec_dim: 512
EncoderDecoderTransformer.enc_depth: 8
EncoderDecoderTransformer.dec_depth: 8
EncoderDecoderTransformer.enc_heads: 8
EncoderDecoderTransformer.dec_heads: 8
EncoderDecoderTransformer.enc_max_seq_len: 258 # bos, eos
EncoderDecoderTransformer.dec_max_seq_len: 258 # bos, eos
EncoderDecoderTransformer.dropout: 0.2 # 0.1 elsewhere; extra regularization for small data
EncoderDecoderTransformer.attention_layer_configs:
  "rel_pos_bias": True
  "rotary_pos_emb": False
  "attn_flash": False
