# Auto-generated by scripts/data/generate_loo_configs.py for the dataset-mixture
# ablation (journal/DATASET_MIX_LOO.md). Variant: 7sets_no_chord_melody_dataset
# (6 dataset(s): hooktheory, pop909, nottingham, wikifonia, jazzmus, emopia_plus).
# Template: configs/enc_dec/enc_dec.chord.7sets.seed=1.alpha=0.5.yml -- every other hyperparameter is unchanged so this
# variant stays comparable with the 7sets runs.
seed: 42
train_steps: 50000
val_interval: 1000
sample_interval: 1000
max_log_examples: 8
overfit_batches: 0
wandb_project: "realchords"
log_every_n_steps: 1
checkpoint_interval: 1000
checkpoint_metric: "val/loss"
checkpoint_mode: "min"
checkpoint_top_k: 3 # 3 best by val/loss (template kept all)
accelerator: "auto"
devices: "auto"
num_nodes: 1
precision: "bf16-mixed"
strategy: "auto"
compile: True
early_stopping_patience: 15

# Data hyperparameters, for get_weighted_dataloader
batch_size: 64
num_workers: 8
cache_dir: "data/cache"
chord_names_path: "data/cache/chord_names_augmented.json"
model_part: "chord"
model_type: "encoder_decoder"
max_len: 512
datasets: ["hooktheory", "pop909", "nottingham", "wikifonia", "jazzmus", "emopia_plus"]
alpha: 0.5
data_augmentation: true

# Optimizer hyperparameters
AdamW.lr: 0.0001
AdamW.weight_decay: 0.0

# LR schedule: "none" (flat), "cosine" (warmup + cosine decay to 0 over
# train_steps), or "plateau" (ReduceLROnPlateau, reacts to val/loss directly)
lr_schedule: "none"  # constant LR = reference implementation, see journal/CONFIGS.md
warmup_steps: 1000

# Model hyperparameters
EncoderDecoderTransformer.enc_dim: 512
EncoderDecoderTransformer.dec_dim: 512
EncoderDecoderTransformer.enc_depth: 8
EncoderDecoderTransformer.dec_depth: 8
EncoderDecoderTransformer.enc_heads: 8
EncoderDecoderTransformer.dec_heads: 8
EncoderDecoderTransformer.enc_max_seq_len: 258 # bos, eos
EncoderDecoderTransformer.dec_max_seq_len: 258 # bos, eos
EncoderDecoderTransformer.dropout: 0.1
EncoderDecoderTransformer.attention_layer_configs:
  "rel_pos_bias": True
  "rotary_pos_emb": False
  "attn_flash": False
