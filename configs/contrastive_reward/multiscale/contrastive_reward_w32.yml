# Multiscale contrastive reward — fixed 32-frame segments (1/8 of 256),
# non-overlapping. Hooktheory-only, matching the original ReaLchords paper's
# reward-model training setup. See contrastive_reward_w16.yml for the
# early_stopping_patience rationale.

seed: 42
train_steps: 30000
val_interval: 100
early_stopping_patience: 15
sample_interval: 1000
max_log_examples: 8
overfit_batches: 0
wandb_project: "realchords"
log_every_n_steps: 1
checkpoint_interval: 500
checkpoint_metric: "val/loss"
checkpoint_mode: "min"
checkpoint_top_k: -1
accelerator: "auto"
devices: "auto"
num_nodes: 1
precision: "bf16-mixed"
strategy: "auto"
compile: True
mask_same_song_negatives: false

batch_size: 196
num_workers: 8
cache_dir: "data/cache"
model_part: "chord"
model_type: "encoder_decoder"
max_len: 64

AdamW.lr: 0.0001
AdamW.weight_decay: 0.0

ContrastiveReward.dim: 512
ContrastiveReward.depth: 6
ContrastiveReward.heads: 6
ContrastiveReward.max_seq_len: 34
EncoderDecoderTransformer.dropout: 0.1
