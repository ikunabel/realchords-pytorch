# Multiscale contrastive reward — fixed 16-frame segments (1/16 of 256),
# non-overlapping (no segment_stride -> defaults to max_len_per_part tiles).
# Hooktheory-only, matching the original ReaLchords paper's reward-model
# training setup (paper trains reward models on Hooktheory only). Adds
# early_stopping_patience=15 so training stops on convergence rather than
# being cut off by the job time limit (the earlier _3_datasets sliding/fixed
# runs hit their SLURM time limit while val/loss was still ~flat, not
# clearly converged -- see journal/CONFIGS.md).

seed: 42
train_steps: 30000
val_interval: 100
early_stopping_patience: 15
sample_interval: 1000
max_log_examples: 8
overfit_batches: 0
wandb_project: "realchords"
log_every_n_steps: 1
checkpoint_interval: 500
checkpoint_metric: "val/loss"
checkpoint_mode: "min"
checkpoint_top_k: -1
accelerator: "auto"
devices: "auto"
num_nodes: 1
precision: "bf16-mixed"
strategy: "auto"
compile: True
mask_same_song_negatives: false

batch_size: 196
num_workers: 8
cache_dir: "data/cache"
model_part: "chord"
model_type: "encoder_decoder"
max_len: 32

AdamW.lr: 0.0001
AdamW.weight_decay: 0.0

ContrastiveReward.dim: 512
ContrastiveReward.depth: 6
ContrastiveReward.heads: 6
ContrastiveReward.max_seq_len: 18
EncoderDecoderTransformer.dropout: 0.1
