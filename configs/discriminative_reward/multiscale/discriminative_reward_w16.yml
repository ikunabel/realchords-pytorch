# Multiscale discriminative reward — fixed 16-frame segments (1/16 of 256),
# non-overlapping (no segment_stride -> defaults to max_len_per_part tiles).
# Hooktheory-only, matching the original ReaLchords paper's reward-model
# training setup (same rationale as configs/contrastive_reward/multiscale/
# contrastive_reward_w16.yml). No overlap-masking needed here (unlike
# contrastive) -- discriminative's negatives come from explicit in-batch
# permutation, not an implicit all-pairs similarity matrix, so a permuted
# pair is only ever a true positive at the exact matching segment; any other
# pairing (same song or not, overlapping or not) is a genuine temporal
# mismatch and a valid negative. See journal/CONFIGS.md for the full
# reasoning.
#
# checkpoint_top_k=5 (not -1) to bound disk usage; early_stopping_patience=10
# (val_interval=100 -> stops after 1000 non-improving steps).

seed: 42
train_steps: 30000
val_interval: 100
early_stopping_patience: 10
sample_interval: 1000
max_log_examples: 8
overfit_batches: 0
wandb_project: "realchords"
log_every_n_steps: 1
checkpoint_interval: 500
checkpoint_metric: "val/loss"
checkpoint_mode: "min"
checkpoint_top_k: 5
accelerator: "auto"
devices: "auto"
num_nodes: 1
precision: "bf16-mixed"
strategy: "auto"
compile: True

batch_size: 128
num_workers: 8
cache_dir: "data/cache"
model_part: "chord"
model_type: "encoder_decoder"
max_len: 32

AdamW.lr: 0.0001
AdamW.weight_decay: 0.0

DiscriminativeReward.dim: 512
DiscriminativeReward.depth: 6
DiscriminativeReward.heads: 6
DiscriminativeReward.max_seq_len: 37
EncoderDecoderTransformer.dropout: 0.1
