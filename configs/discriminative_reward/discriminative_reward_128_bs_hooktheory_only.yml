seed: 42
train_steps: 3000
val_interval: 100
sample_interval: 1000
max_log_examples: 8
overfit_batches: 0
wandb_project: "realchords"
log_every_n_steps: 1
checkpoint_interval: 500
checkpoint_metric: "val/loss"
checkpoint_mode: "min"
checkpoint_top_k: 3 # 3 best by val/loss (template kept all)
accelerator: "auto"
devices: "auto"
num_nodes: 1
precision: "bf16-mixed"
strategy: "auto"
compile: True

# Data hyperparameters, for get_weighted_dataloader
batch_size: 128
num_workers: 4
cache_dir: "data/cache"
chord_names_path: "data/cache/chord_names_augmented.json"
model_part: "chord"
model_type: "encoder_decoder"
max_len: 512
datasets: ["hooktheory"]
alpha: 1 # proportional: equalises per-item exposure and makes ~47% of in-batch negatives same-corpus (22% at 0.5) -- a discriminator needs hard negatives, not a matched output distribution
