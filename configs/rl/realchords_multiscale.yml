# A/B variant of the already-finished realchords run
# (/hpcwork/thes2192/realchords/logs/my_logs/rl/realchords) -- swaps the
# single-scale (256-frame) contrastive/discriminative reward models for the
# multiscale versions (legacy full-context score averaged with w16/w32/w64/w128
# sliding-window scores, see MultiscaleContrastiveRewardFn/
# MultiscaleDiscriminativeRewardFn), using this repo's dedicated
# non-GAIL multiscale training entrypoint
# (train_rl_ensemble_rhythm_reward_offline_anchor_multiscale.py), which mirrors
# realchords.yml's recipe (ReaLchordsPPOTrainer, no GAIL) rather than gapt.yml's.
#
# Supersedes an earlier contrastive-only version of this file (checkpoints
# step=28000/13500 for w32/w128) -- discriminative multiscale didn't exist
# yet at the time, and those steps were resolved before the
# resolve_best_checkpoint() fix, so they weren't actually the lowest-val-loss
# checkpoints. Now includes both reward types and both sets of checkpoints
# are the actual lowest-val-loss steps.
#
# Sliding-window checkpoints only (not fixed-tile) -- sliding won or tied at
# every scale for both reward types, see journal/REWARD_MODELS.md.
#
# Every checkpoint path below (legacy AND multiscale) is that run's actual
# lowest-validation-loss step, resolved via eval_reward_recall.py's
# resolve_best_checkpoint() and taken directly from
# logs/eval/recall/contrastive_20260803_165301.csv and
# discriminative_20260803_214510.csv. Note this means the legacy
# contrastive_reward_model_path here (step=7500) differs slightly from
# realchords.yml's hardcoded step=8000 -- that config predates the
# best-checkpoint-resolution fix and was never updated; left as-is there since
# changing it wouldn't retroactively fix the already-finished baseline run
# it's meant to reproduce.
#
# Paper quote (Appendix H): "To train ReaLchords-M, we apply a coefficient of
# 10 to both the repetition penalty and silence penalty." Applied directly
# below -- note this means this A/B varies two things at once relative to the
# finished `realchords` baseline (reward models AND these two penalty
# weights), not a strict single-variable test; kept this way because the
# paper specifies it as part of what "training ReaLchords-M" means, not as an
# independent hyperparameter choice.
#
# Multiscale per-component eval (multiscale_contrastive_w16/w32/.../combined,
# multiscale_discriminative_w16/.../combined) is already logged to wandb by
# both reward functions' forward() -- no extra wiring needed, verified against
# gapt_multiscale's existing wandb export.

$include:
  - configs/rl/realchords.yml

contrastive_reward_model_path:
  - "/hpcwork/thes2192/realchords/logs/my_logs/contrastive_reward/contrastive_reward/step=7500.ckpt"
  - "/hpcwork/thes2192/realchords/logs/my_logs/contrastive_reward/contrastive_reward_2/step=8000.ckpt"
discriminative_reward_model_path:
  - "/hpcwork/thes2192/realchords/logs/my_logs/discriminative_reward/discriminative_reward_128_bs/step=2000.ckpt"
  - "/hpcwork/thes2192/realchords/logs/my_logs/discriminative_reward/discriminative_reward_128_bs_2/step=2500.ckpt"

multiscale_contrastive_reward_model_path:
  - "/hpcwork/thes2192/realchords/logs/my_logs/contrastive_reward/contrastive_reward_w16_sliding_2o1vixac/step=18500.ckpt"
  - "/hpcwork/thes2192/realchords/logs/my_logs/contrastive_reward/contrastive_reward_w32_sliding_57e9e6hx/step=27500.ckpt"
  - "/hpcwork/thes2192/realchords/logs/my_logs/contrastive_reward/contrastive_reward_w64_sliding_etmmo7ww/step=21500.ckpt"
  - "/hpcwork/thes2192/realchords/logs/my_logs/contrastive_reward/contrastive_reward_w128_sliding_zrdzoy4s/step=11500.ckpt"
multiscale_contrastive_window_lens: [16, 32, 64, 128]

multiscale_discriminative_reward_model_path:
  - "/hpcwork/thes2192/realchords/logs/my_logs/discriminative_reward/discriminative_reward_w16_sliding_koofktu6/step=12000.ckpt"
  - "/hpcwork/thes2192/realchords/logs/my_logs/discriminative_reward/discriminative_reward_w32_sliding_g9vebcbo/step=11500.ckpt"
  - "/hpcwork/thes2192/realchords/logs/my_logs/discriminative_reward/discriminative_reward_w64_sliding_5yvynlt3/step=9000.ckpt"
  - "/hpcwork/thes2192/realchords/logs/my_logs/discriminative_reward/discriminative_reward_w128_sliding_0in6e5z8/step=11500.ckpt"
multiscale_discriminative_window_lens: [16, 32, 64, 128]

# Paper-stated ReaLchords-M coefficients (Appendix H)
repetition_penalty_weight: 10.0
silence_penalty_weight: 10.0
