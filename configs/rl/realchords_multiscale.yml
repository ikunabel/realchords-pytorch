# A/B variant of realchords.yml -- adds the multiscale contrastive reward
# (legacy full-rollout scale + w16/w32/w64/w128 sliding-window scales,
# averaged; see realchords/rl/reward/multiscale_contrastive_rewards.py) on
# top of the plain ReaLchords recipe, run via
# train_rl_ensemble_rhythm_reward_offline_anchor_multiscale.py (no GAIL, no
# other GAPT-specific changes), so any effect can be attributed to the
# multiscale reward itself rather than being entangled with GAPT's other
# advantages (corrected actor/critic LR, GAIL discriminator, etc.).
#
# Checkpoints are hooktheory-only (configs/contrastive_reward/multiscale/
# contrastive_reward_w{16,32,64,128}_sliding.yml, early_stopping_patience=15),
# matching realchords.yml's existing (also hooktheory-only) global
# contrastive_reward_model_path -- so the only variable vs. realchords.yml is
# single-scale vs. multi-scale scoring, not which data trained the reward
# model. Sliding chosen over fixed at every scale based on
# scripts/eval/eval_reward_recall.py retrieval results (journal/CONFIGS.md):
# sliding wins clearly at w128/w64/w32, and is close (fixed marginally ahead)
# only at w16.

$include:
  - configs/rl/realchords.yml

multiscale_contrastive_reward_model_path:
  - "/hpcwork/thes2192/realchords/logs/my_logs/contrastive_reward/contrastive_reward_w16_sliding_2o1vixac/step=18500.ckpt"
  - "/hpcwork/thes2192/realchords/logs/my_logs/contrastive_reward/contrastive_reward_w32_sliding_57e9e6hx/step=28000.ckpt"
  - "/hpcwork/thes2192/realchords/logs/my_logs/contrastive_reward/contrastive_reward_w64_sliding_etmmo7ww/step=21500.ckpt"
  - "/hpcwork/thes2192/realchords/logs/my_logs/contrastive_reward/contrastive_reward_w128_sliding_zrdzoy4s/step=13500.ckpt"
multiscale_contrastive_window_lens: [16, 32, 64, 128]
