# GAPT-M on hooktheory: gapt_hooktheory.yml with the frozen contrastive and discriminative
# rewards replaced by their multiscale versions -- the same multiscale checkpoints as
# realchords_multiscale.yml, so gapt_hooktheory -> gapt_multiscale_hooktheory is the same
# change as realchords -> realchords_multiscale. The GAIL discriminator stays full-context.
# Needs the opt-in multiscale discriminative support in
# scripts/train/train_rl_ensemble_rhythm_reward_offline_anchor_gail_multiscale.py.
# Run with scripts/jobscripts/train_variants/rl/submit_gapt_multiscale.sh.

$include:
  - configs/rl/gapt_hooktheory.yml

multiscale_contrastive_reward_model_path:
  - "/hpcwork/thes2192/realchords/logs/my_logs/contrastive_reward/contrastive_reward_w16_sliding_2o1vixac/step=18500.ckpt"
  - "/hpcwork/thes2192/realchords/logs/my_logs/contrastive_reward/contrastive_reward_w32_sliding_57e9e6hx/step=27500.ckpt"
  - "/hpcwork/thes2192/realchords/logs/my_logs/contrastive_reward/contrastive_reward_w64_sliding_etmmo7ww/step=21500.ckpt"
  - "/hpcwork/thes2192/realchords/logs/my_logs/contrastive_reward/contrastive_reward_w128_sliding_zrdzoy4s/step=11500.ckpt"
multiscale_contrastive_window_lens: [16, 32, 64, 128]

multiscale_discriminative_reward_model_path:
  - "/hpcwork/thes2192/realchords/logs/my_logs/discriminative_reward/discriminative_reward_w16_sliding_koofktu6/step=12000.ckpt"
  - "/hpcwork/thes2192/realchords/logs/my_logs/discriminative_reward/discriminative_reward_w32_sliding_g9vebcbo/step=11500.ckpt"
  - "/hpcwork/thes2192/realchords/logs/my_logs/discriminative_reward/discriminative_reward_w64_sliding_5yvynlt3/step=9000.ckpt"
  - "/hpcwork/thes2192/realchords/logs/my_logs/discriminative_reward/discriminative_reward_w128_sliding_0in6e5z8/step=11500.ckpt"
multiscale_discriminative_window_lens: [16, 32, 64, 128]
