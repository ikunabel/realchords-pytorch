# GAPT on the 7sets_no_hooktheory mixture with reward models also trained without Hooktheory
# (journal/experiments/SHARED_REWARD_MODELS.md, 2026-11-14). Identical to gapt_loo_7sets_no_hooktheory.alpha=0.5.seed=43.yml except the
# eight reward-model paths, which point at the best checkpoints of the *_7sets_no_hooktheory runs.

# GAPT on the 7sets_no_hooktheory mixture, seed 43, alpha 0.5.
# Generated by scripts/data/generate_gapt_loo_configs.py.
# Init and anchor are that variant's own MLE models, each the
# lowest-aggregate-val/loss checkpoint of its run. Reward models are the
# 7-set ensemble for every variant -- they were shown to transfer.
# GAPT on the 7-set mixture at alpha=0.5, seed 42 -- the RL half of the alpha sweep.
# Policy and offline anchor are this cell's own MLE models (best val/loss). The reward
# models are shared across all cells and trained at alpha=1: they are fixed apparatus, so
# only the policy's mixture varies, and a discriminator wants hard negatives rather than a
# matched output distribution (journal/experiments/ALPHA_SWEEP.md).
#
#

$include:
  - configs/decoder_only/decoder.chord.7sets_no_hooktheory.seed=43.alpha=0.5.yml
  - configs/single_agent_rl/rl_realchords_base.yml

chord_names_path: "data/cache/chord_names_augmented.json"
lit_module_override_args:
  chord_names_path: "data/cache/chord_names_augmented.json"
  data_path: "data/hooktheory/Hooktheory.json.gz"
  num_workers: 4
pretrain_model_path: "/hpcwork/thes2192/realchords/logs/my_logs/decoder_only/decoder.chord.7sets_no_hooktheory.seed=43.alpha=0.5_5sduyngb/step=5000.ckpt"
anchor_model_path: "/hpcwork/thes2192/realchords/logs/my_logs/enc_dec/enc_dec.chord.7sets_no_hooktheory.seed=43.alpha=0.5_98zxs9y6/step=7000.ckpt"
contrastive_reward_model_path:
  - "/hpcwork/thes2192/realchords/logs/my_logs/contrastive_reward/contrastive_reward_7sets_no_hooktheory_x5szk93w/step=1500.ckpt"
  - "/hpcwork/thes2192/realchords/logs/my_logs/contrastive_reward/contrastive_reward_2_7sets_no_hooktheory_wudr4nid/step=2500.ckpt"
discriminative_reward_model_path:
  - "/hpcwork/thes2192/realchords/logs/my_logs/discriminative_reward/discriminative_reward_128_bs_7sets_no_hooktheory_usn87i6a/step=2500.ckpt"
  - "/hpcwork/thes2192/realchords/logs/my_logs/discriminative_reward/discriminative_reward_128_bs_2_7sets_no_hooktheory_nnkwda84/step=2000.ckpt"
contrastive_reward_rhythm_model_path:
  - "/hpcwork/thes2192/realchords/logs/my_logs/contrastive_reward/contrastive_reward_no_augmentation_rhythm_7sets_no_hooktheory_v19ajlxc/step=1500.ckpt"
  - "/hpcwork/thes2192/realchords/logs/my_logs/contrastive_reward/contrastive_reward_no_augmentation_rhythm_2_7sets_no_hooktheory_isg5xy97/step=2500.ckpt"
discriminative_reward_rhythm_model_path:
  - "/hpcwork/thes2192/realchords/logs/my_logs/discriminative_reward/discriminative_reward_no_augmentation_rhythm_7sets_no_hooktheory_e5i4l0aq/step=2500.ckpt"
  - "/hpcwork/thes2192/realchords/logs/my_logs/discriminative_reward/discriminative_reward_no_augmentation_rhythm_2_7sets_no_hooktheory_rw6b5a91/step=3000.ckpt"

contrastive_reward_weight: 1.0
discriminative_reward_weight: 1.0
contrastive_reward_rhythm_weight: 1.0
discriminative_reward_rhythm_weight: 1.0
early_stop_penalty_weight: 1.0
invalid_output_penalty_weight: 1.0
silence_penalty_weight: 1.0
long_note_penalty_weight: 0.0
repetition_penalty_weight: 1.0
repetition_penalty_threshold: 4
model_part: "chord"
micro_rollout_batch_size: 384
rollout_batch_size: 384
micro_train_batch_size: 48
train_batch_size: 48
# limit_eval_batches 1, not the usual 4: this variant's validation set is only 418
# songs (Hooktheory is 1,943 of the 2,361 across all seven), so at rollout_batch_size
# 384 the loader yields 384 then a partial 34. rl_trainer.log_eval accumulates
# per-sample tensors across batches with `status_list[k] += v`, which assumes every
# batch is the same size, so the partial batch raised
#   RuntimeError: size of tensor a (384) must match tensor b (34)
# and killed all three seeds ~3 min in (jobs 4860450-52). One full batch avoids it.
# This only affects in-training wandb logging -- limit_eval_batches is used nowhere
# but rl_trainer.evaluate(), so the trained policy is unchanged and stays comparable
# to the other variants.
limit_eval_batches: 1
num_steps: 1000

entropy_loss_coef: 0.01
gail_reward_weight: 1.0
gail_discriminative_model_configs:
  dim: 512
  depth: 8
  heads: 8
  dropout: 0.1
gail_reward_learning_rate: !!float 9e-5
reward_update_steps: 5 # update reward every n steps
reward_update_early_stop_steps: 500
enable_reward_label_smoothing: true
gail_reward_formulation: "logits_prob_log"
reward_update_strategy: "average"
reward_average_steps: 3
reward_update_threshold: 1.0
reward_apply_threshold_after_steps: 200
logits_vram_swap: true
