$include:
  - configs/decoder_only/decoder_only_online_chord.yml
  - configs/single_agent_rl/rl_realchords_base.yml

pretrain_model_path: "/hpcwork/thes2192/realchords/logs/my_logs/decoder_only/decoder_only_online_chord/step=11000.ckpt"
contrastive_reward_model_path: 
  - "/hpcwork/thes2192/realchords/logs/my_logs/contrastive_reward/contrastive_reward/step=8000.ckpt"
  - "/hpcwork/thes2192/realchords/logs/my_logs/contrastive_reward/contrastive_reward_2/step=8000.ckpt"
discriminative_reward_model_path:
  - "/hpcwork/thes2192/realchords/logs/my_logs/discriminative_reward/discriminative_reward_128_bs/step=1500.ckpt"
  - "/hpcwork/thes2192/realchords/logs/my_logs/discriminative_reward/discriminative_reward_128_bs_2/step=1500.ckpt"
contrastive_reward_rhythm_model_path:
  - "/hpcwork/thes2192/realchords/logs/my_logs/contrastive_reward/contrastive_reward_no_augmentation_rhythm/step=2000.ckpt"
  - "/hpcwork/thes2192/realchords/logs/my_logs/contrastive_reward/contrastive_reward_no_augmentation_rhythm_2/step=2000.ckpt"
discriminative_reward_rhythm_model_path:
  - "/hpcwork/thes2192/realchords/logs/my_logs/discriminative_reward/discriminative_reward_no_augmentation_rhythm/step=3000.ckpt"
  - "/hpcwork/thes2192/realchords/logs/my_logs/discriminative_reward/discriminative_reward_no_augmentation_rhythm_2/step=3000.ckpt"

# Reward weights
contrastive_reward_weight: 1.0
discriminative_reward_weight: 1.0
contrastive_reward_rhythm_weight: 1.0
discriminative_reward_rhythm_weight: 1.0
early_stop_penalty_weight: 1.0
invalid_output_penalty_weight: 1.0
silence_penalty_weight: 1.0
long_note_penalty_weight: 0.0
repetition_penalty_weight: 1.0

anchor_model_path: "/hpcwork/thes2192/realchords/logs/my_logs/enc_dec/enc_dec_base_chord/step=10000.ckpt"

# realchords specific
model_part: "chord"

micro_rollout_batch_size: 384
rollout_batch_size: 384
micro_train_batch_size: 48
train_batch_size: 48
limit_eval_batches: 4
repetition_penalty_threshold: 4

# LR: use rl_realchords_base.yml's default (5e-6/9e-5). This previously carried a
# 5e-7/9e-6 override (apparently copy-pasted from gapt.yml's GAPT-paper value, not
# ReaLchords paper's own 1e-4/1e-4) that didn't match the actual finished baseline run
# (its args.yml confirms 5e-6/9e-5). Both A/B tests (this pair and gapt vs
# gapt_paper_authentic) found the base default wins -- see journal/rl_learning_rate.md.

num_steps: 1000
