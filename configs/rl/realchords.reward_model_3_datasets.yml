# A/B variant of realchords.yml -- swaps the global contrastive_reward_model_path
# from the hooktheory-only checkpoints to the 3-dataset-trained ones (same
# checkpoints gapt.yml uses), so it can serve as the baseline for
# the multiscale ReaLchords config (the old x10-penalty realchords_multiscale.yml
# was deleted, see journal/RL_MULTISCALE_RHYTHM_COLLAPSE.md; to be recreated
# with penalty weights 1.0): both configs then use the same reward-model
# training data, isolating single-scale vs. multi-scale as the only variable
# between them (rather than also varying which data trained the reward model).

$include:
  - configs/rl/realchords.yml

contrastive_reward_model_path:
  - "/hpcwork/thes2192/realchords/logs/my_logs/contrastive_reward/contrastive_reward_3_datasets/step=8000.ckpt"
  - "/hpcwork/thes2192/realchords/logs/my_logs/contrastive_reward/contrastive_reward_2_3_datasets/step=8000.ckpt"
