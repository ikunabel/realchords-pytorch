# Single-variable test: does annealing the LR around the best checkpoint help?
# Identical to the reference decoder_only_online_chord.yml (hooktheory, seed 42,
# constant AdamW 1e-4 = repo/HF default and GAPT paper) except the schedule:
# 1000-step warmup, then cosine to 0 over train_steps. train_steps is 15000 so
# the LR is actually low near where the constant run's best checkpoint was
# (step ~12k, val/loss 0.4396). Our earlier schedule ablation used cosine over
# 50k steps, which was still at ~90% of peak at the minimum -- it never tested this.
# Seed-to-seed spread of best val/loss (seed 42 vs seed 1): ~0.0013.
# See journal/CONFIGS.md.
# Trainer hyperparameters, for Trainer and lit_module
seed: 42
train_steps: 15000
val_interval: 1000
sample_interval: 5000
overfit_batches: 0
wandb_project: "realchords"
log_every_n_steps: 1
checkpoint_interval: 1000
checkpoint_metric: "val/loss"
checkpoint_mode: "min"
checkpoint_top_k: -1 # save all checkpoints
accelerator: "auto"
devices: "auto"
num_nodes: 1
precision: "bf16-mixed"
strategy: "auto"
compile: True

# Data hyperparameters, for get_dataloader
batch_size: 64
num_workers: 8
cache_dir: "data/cache"

# Dataloader hyperparameters, for HooktheoryDataset
model_part: "chord"
max_len: 512
model_type: "decoder_only"

# Optimizer hyperparameters
AdamW.lr: 0.0001
AdamW.weight_decay: 0.0

# Model hyperparameters
DecoderTransformer.dim: 512
DecoderTransformer.depth: 8
DecoderTransformer.heads: 8
DecoderTransformer.max_seq_len: 514 # bos, eos
DecoderTransformer.dropout: 0.1

# LR schedule (the only change vs. the reference besides train_steps)
lr_schedule: "cosine"
warmup_steps: 1000
