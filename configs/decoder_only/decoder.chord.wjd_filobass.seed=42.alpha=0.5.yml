# Decoder-only (online) chord model on the two walking-bass datasets only (WJD + FiloBass; the
# "melody" lane is a walking bass line): the online counterpart of
# configs/enc_dec/enc_dec.chord.wjd_filobass.seed=42.alpha=0.5.yml, with the same small-data
# monitoring (validation/checkpoints every 100 steps, early stopping after 20 non-improving checks,
# 5 best checkpoints kept, dropout 0.2). Otherwise identical to the 7sets decoder (seed 42,
# constant LR 1e-4, alpha 0.5, architecture of decoder_only_online_chord). See
# journal/DATASET_MIX_LOO.md.
# Trainer hyperparameters, for Trainer and lit_module
seed: 42
train_steps: 10000 # upper bound; early stopping ends it much earlier
val_interval: 100
sample_interval: 500
overfit_batches: 0
wandb_project: "realchords"
log_every_n_steps: 1
checkpoint_interval: 100
checkpoint_metric: "val/loss"
checkpoint_mode: "min"
checkpoint_top_k: 5 # keep the 5 best by val/loss
accelerator: "auto"
devices: "auto"
num_nodes: 1
precision: "bf16-mixed"
strategy: "auto"
compile: True

early_stopping_patience: 20 # validation checks, i.e. 2k steps

# Data hyperparameters, for get_weighted_dataloader
batch_size: 64
num_workers: 8
cache_dir: "data/cache"
chord_names_path: "data/cache/chord_names_augmented.json"
model_part: "chord"
model_type: "decoder_only"
max_len: 512

datasets: ["wjd", "filobass"]
alpha: 0.5
data_augmentation: true

# Optimizer hyperparameters
AdamW.lr: 0.0001
AdamW.weight_decay: 0.0

# LR schedule: "none" (flat), "cosine" (warmup + cosine decay to 0 over
# train_steps), or "plateau" (ReduceLROnPlateau, reacts to val/loss directly)
lr_schedule: "none"  # constant LR = reference implementation, see journal/CONFIGS.md
warmup_steps: 1000

# Model hyperparameters
DecoderTransformer.dim: 512
DecoderTransformer.depth: 8
DecoderTransformer.heads: 8
DecoderTransformer.max_seq_len: 514 # bos, eos
DecoderTransformer.dropout: 0.2 # 0.1 elsewhere; extra regularization for small data
