<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <title>Generative Jamming</title>
  <!-- <link rel="icon" href="https://magenta.tensorflow.org/favicon.ico" type="image/x-icon" /> -->
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Roboto">

  <script src="https://cdn.jsdelivr.net/npm/webmidi@3.3.1/dist/iife/webmidi.iife.js"></script>
  <script src="https://unpkg.com/tone" type="module"></script>
  <script src="https://unpkg.com/@tonejs/midi"></script>
  <script src="tonejs_instruments.js"></script>
  <script src="note_visualization.js" type="module"></script>
  <script src="play_from_midi_input.js"></script>
  <script src="main.js" type="module"></script>
</head>

<body>
  <div class="splash">
    <h1>Generative Jamming</h1>
    <div class="splash-main">
      <p>Jam live with an AI accompanist!</p>
      <button class="splash-button loading" id="play-btn" disabled autofocus>
        <span>Loading...</span>
      </button>
    </div>
  </div>

  <div class="loaded" hidden>
    <div class="footer">
      <div class="stack">
        <div class="flex-wide">
          <button id="metronome-button" class="footer-button">
            <span>Enable Metronome</span>
          </button>
          <buton id="metronome-freq-button" class="footer-button">
            <span>1/4</span>
            </button>
        </div>
        <div class="flex-wide">
          <label for="bpm-input">Beats per Minute</label>
          <input id="bpm-input" type="number" min="1" max="300" step="1" />
        </div>
        <div class="flex-wide">
          <label for="time-sig-input">Beats per Measure</label>
          <input id="time-sig-input" type="number" min="1" max="16" step="1" />
        </div>
      </div>
      <div class="stack">
        <div class="flex-wide">
          <label for="silence-input">Initial Beats of Silence</label>
          <input id="silence-input" type="number" min="0" max="16" step="1" />
        </div>
        <div class="flex-wide">
          <label for="lookahead-input">Lookahead Beats</label>
          <input id="lookahead-input" type="number" min="1" max="8" step="1" />
        </div>
        <div class="flex-wide">
          <label for="commitahead-input">Commit Beats</label>
          <input id="commitahead-input" type="number" min="0" max="8" step="1" />
        </div>
      </div>
      <div class="stack">
        <div class="flex-wide">
          <label for="temperature-input">Temperature</label>
          <input id="temperature-input" type="number" min="0" max="3" step="0.1" />
        </div>
        <div class="flex-wide">
          <label for="model-select">Model</label>
          <select id="model-select"></select>
        </div>
      </div>
      <div class="stack">
        <button id="live-session-button" class="footer-button" disabled>
          <span>Start Live Session</span>
        </button>
        <div class="flex-wide">
          <label for="download-session-check">Download Sessions</label>
          <input id="download-session-check" type="checkbox" checked="checked" />
        </div>
        <div class="flex-wide">
          <label for="metronome-check">Metronome Enabled</label>
          <input id="metronome-check" type="checkbox" checked="checked" />
        </div>
      </div>
      <div class="stack">
        <div class="flex-wide">
          <label for="song-search-input">Robot Melody: Search</label>
          <input id="song-search-input" type="text" autocomplete="off"
            placeholder="song or artist..." />
        </div>
        <div class="flex-wide">
          <label for="reference-mode-check">Play Ground Truth (no model)</label>
          <input id="reference-mode-check" class="centered" type="checkbox" />
        </div>
        <div id="song-search-results" class="search-results"></div>
      </div>
      <div class="stack">
        <label for="show-chords-check">Show Incoming Chords</label>
        <div class="flex-wide">
          <input id="show-chords-check" class="centered" type="checkbox" checked="checked" />
        </div>
      </div>
      <div class="stack">
        <label for="custom-voicings-check">Use Custom Voicings</label>
        <div class="flex-wide">
          <input id="custom-voicings-check" class="centered" type="checkbox" />
        </div>
      </div>
      <div class="stack">
        <div class="flex-wide">
          <label for="vl-weight-input">Voicing: Voice Leading</label>
          <input id="vl-weight-input" type="range" min="0" max="1" step="0.05" value="0.5" />
          <span id="vl-weight-value" class="slider-value">0.50</span>
        </div>
        <div class="flex-wide">
          <label for="reg-weight-input">Voicing: Register</label>
          <input id="reg-weight-input" type="range" min="0" max="1" step="0.05" value="0.2" />
          <span id="reg-weight-value" class="slider-value">0.20</span>
        </div>
      </div>
      <div class="stack">
        <div class="flex-wide">
          <label for="chord-timing-select">Chord Timing</label>
          <select id="chord-timing-select">
            <option value="auto">Auto (model decides when)</option>
            <option value="manual">Manual (space plays next chord)</option>
            <option value="triggered">Triggered (space plays the scheduled chord)</option>
          </select>
        </div>
        <div class="flex-wide">
          <span id="chord-timing-info">Press space during a session to play the next chord</span>
        </div>
      </div>
      <div class="stack">
        <div class="flex-wide">
          <label for="voicing-browser-chord-select">Voicing Browser: Chord</label>
          <select id="voicing-browser-chord-select"><option value="">-- choose chord --</option></select>
        </div>
        <div class="flex-wide">
          <span id="voicing-browser-info">Select a chord, then use &#8592;/&#8594; to browse its stored voicings (plays outside any session)</span>
        </div>
      </div>
      <div class="stack">
        <div class="flex-wide">
          <label for="chord-inst-select">Chord Instrument</label>
          <select id="chord-inst-select"></select>
        </div>
        <div class="flex-wide">
          <label for="melody-inst-select">Melody Instrument</label>
          <select id="melody-inst-select"></select>
        </div>
      </div>
      <div class="stack">
        <div class="flex-wide">
          <label for="chord-output-select" title="Where chords and the robot melody play. A MIDI device (e.g. the Disklavier) replaces the laptop instruments for both.">Output</label>
          <select id="chord-output-select">
            <option value="">Laptop (instruments)</option>
          </select>
        </div>
        <div class="flex-wide">
          <label for="midi-velocity-input" title="How hard the piano plays the chords (MIDI velocity). Softer notes sound later, so re-tune Send Early after changing this.">MIDI Chord Velocity</label>
          <input id="midi-velocity-input" type="range" min="1" max="127" step="1" value="40" />
          <span id="midi-velocity-value" class="slider-value">40</span>
        </div>
        <div class="flex-wide">
          <label for="midi-melody-velocity-input" title="How hard the piano plays the robot melody (song playback).">MIDI Melody Velocity</label>
          <input id="midi-melody-velocity-input" type="range" min="1" max="127" step="1" value="55" />
          <span id="midi-melody-velocity-value" class="slider-value">55</span>
        </div>
        <div class="flex-wide">
          <label for="midi-lead-input" title="Send chords this much early to cover the piano's mechanical latency. Calibrate with MIDI IN Delay off.">MIDI Send Early (ms)</label>
          <input id="midi-lead-input" type="number" min="0" max="600" step="5" value="100" />
        </div>
        <div class="flex-wide">
          <label for="midi-restrike-input" title="How long a key is released before the same note is struck again, after a long note. Too short and the action can't reset, so the note keeps ringing instead of sounding again. 200 ms works on the ENSPIRE U1 (louder notes need more). Fast repeats get less (see Min Hold).">MIDI Re-strike Gap (ms)</label>
          <input id="midi-restrike-input" type="number" min="0" max="500" step="10" value="200" />
        </div>
        <div class="flex-wide">
          <label for="midi-min-hold-input" title="For fast repeats of the same key, keep it held at least this long and shorten the re-strike gap instead (down to 50 ms): a soft note released too soon doesn't sound, while a briefly held key resets quickly. Lower it to give fast repeats a longer release instead.">MIDI Min Hold (ms)</label>
          <input id="midi-min-hold-input" type="number" min="0" max="500" step="10" value="130" />
        </div>
      </div>
      <div class="stack">
        <div class="flex-wide">
          <label for="interface-select">MIDI Interface</label>
          <select id="interface-select"></select>
        </div>
      </div>
    </div>
    <div class="background"></div>
  </div>
</body>

</html>
